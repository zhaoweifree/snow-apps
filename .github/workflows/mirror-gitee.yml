# Push this repository's main to the Gitee mirror.
#
# Direction matters, and it is the opposite of what the file said before
# 2026-10-21. The workstation's `origin` is Gitee and there is now a second
# remote (`github`) that exists so GitHub Actions can compile Linux
# (docs-uos-linux-port.md §9.6.8). A `push: branches: [main]` trigger here would
# therefore fire on every mirror push, try to push the code back to the remote it
# just came from, and fail on a repository that has no GITEE_TOKEN secret -- a
# guaranteed red run next to the build that actually matters.
#
# Manual dispatch only: run it when GitHub has commits Gitee has not seen yet.
name: Mirror main to Gitee

on:
  workflow_dispatch:
  push:
    branches: [mirror-gitee]

permissions:
  contents: read

concurrency:
  group: mirror-gitee-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Push main to Gitee
        env:
          # Defaults to this fork's mirror. `vars.GITEE_REPO` overrides it for a
          # checkout that mirrors somewhere else.
          GITEE_REPO: ${{ vars.GITEE_REPO || 'zhaoweifree/snow-apps' }}
          GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'zhaoweifree' }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo 'Configure the GITEE_TOKEN repository secret with Gitee write access.' >&2
            exit 1
          fi
          auth="$(printf '%s:%s' "$GITEE_USERNAME" "$GITEE_TOKEN" | base64 -w 0)"
          git -c "http.https://gitee.com/.extraheader=Authorization: Basic $auth" \
            push "https://gitee.com/$GITEE_REPO.git" HEAD:refs/heads/main
