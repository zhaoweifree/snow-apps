[package]
name = "snow-selected-text"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Bounded cross-platform selected-text acquisition with guarded clipboard fallback"

[features]
# A separate application FFI archive must use the host's launch-scoped policy,
# rather than initialize a second copy of snow-core's process state.
host-application-qos = []

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_UI_Controls",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Reading PRIMARY needs only the core protocol, so no extension feature is
# enabled. `default-features = false` keeps libc out, which keeps the Linux path
# type-checkable from the Windows dev box with a bare
# `cargo check --target <linux-triple>`.
x11rb = { version = "0.14", default-features = false }

[dependencies]
snow-core = { path = "../snow-core" }
# The focused widget's own selection and its rectangle, over the accessibility
# bus. A separate crate rather than `snow-linux` because this archive is meant to
# stay clear of that dependency surface; `snow-atspi` depends only on `zbus`, and
# only on Linux -- its own logic is platform-neutral, which is why it is a plain
# dependency: the route decision and the bounds conversion are unit tested here
# on the Windows dev box, not on the machine that has a desktop bus.
snow-atspi = { path = "../snow-atspi" }
