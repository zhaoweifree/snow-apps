[package]
name = "snow-linux"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Linux (X11 / Wayland) platform backend for Snow Apps"

[dependencies]
snow-core = { path = "../snow-core" }
thiserror.workspace = true
# The keycap overlay needs text, and neither fontconfig nor FreeType is
# available without a C toolchain. `ab_glyph` rasterizes outlines and
# `ttf-parser` reads the `name` table during font discovery, both in pure Rust,
# which keeps the text path type-checkable from a Windows host.
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
ttf-parser = "0.25.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust X11 bindings: no libxcb / no C toolchain required, which keeps the
# crate cross-checkable from a Windows host with
# `cargo check --target x86_64-unknown-linux-gnu`.
x11rb = { version = "0.14", default-features = false, features = [
    "randr",
    "xfixes",
    "xinput",
] }
# The input observer hands events to its consumer over a channel, and the
# consumer selects on it alongside its own stop signal; matching the channel type
# the macOS observer already uses keeps both adapters shaped the same way.
crossbeam-channel.workspace = true
